<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Panel de las chicas</title>
<style>
@font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/fraunces-latin-wght-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-style:normal;font-weight:300 900;font-display:swap;src:url(fonts/figtree-latin-wght-normal.woff2) format('woff2')}
*{box-sizing:border-box}
body{margin:0;background:#FBF3E4;color:#16342A;font-family:'Figtree',system-ui,sans-serif;display:flex;justify-content:center}
.wrap{width:100%;max-width:640px;padding:18px 16px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0}
h1{font-size:28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.warn{background:#A8232F;color:#fff;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600}
.card{background:#fff;border:2px solid #16342A;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.sub{border-width:1.5px;border-color:#CFC3A6;border-radius:14px;padding:12px;background:#FFFCF5}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:#3F5649}
input[type=text],input[type=email],input[type=password],input[type=datetime-local],textarea{font:600 15px 'Figtree',system-ui,sans-serif;color:#16342A;border:2px solid #16342A;border-radius:10px;padding:9px 10px;background:#fff;width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.4}
button{font:700 14px 'Figtree',system-ui,sans-serif;border:2px solid #16342A;background:#fff;color:#16342A;border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
button.pri{background:#16342A;color:#FBF3E4}
button.red{background:#A8232F;border-color:#A8232F;color:#fff}
button.on{background:#2E5A47;border-color:#2E5A47;color:#fff}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:4px 10px}
.t-open{background:#E4EFE0;color:#1F4A3A}.t-closed{background:#F1E8D4;color:#6B5A2E}
.t-solved{background:#E4EFE0;color:#1F4A3A}.t-blown{background:#FBE3E1;color:#7E1A23}.t-active{background:#FFF1C9;color:#6B5200}.t-locked{background:#ECE6D6;color:#5B6660}
.muted{font-size:13px;color:#4D5E54;line-height:1.4}
details summary{cursor:pointer;font-weight:700;font-size:14px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#16342A;color:#FBF3E4;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:9}
.toast.err{background:#A8232F}
:focus-visible{outline:3px solid #D4A73C;outline-offset:2px}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  var C = window.CONFIG || {};
  var TK = 'nv-admin-token';
  var token = null, days = [], words = [], busy = false;
  var app = document.getElementById('app');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(m, err) {
    var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role', 'status'); t.textContent = m;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
  }
  function hdr(extra) {
    var h = { 'apikey': C.anonKey, 'Content-Type': 'application/json' };
    h['Authorization'] = 'Bearer ' + (token || C.anonKey);
    for (var k in extra) h[k] = extra[k];
    return h;
  }
  async function api(method, path, body, extra) {
    var r = await fetch(C.url + path, { method: method, headers: hdr(extra || {}), body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401 || r.status === 403) { token = null; try { sessionStorage.removeItem(TK); } catch (e) {} showLogin('La sesión ha caducado. Vuelve a entrar.'); throw new Error('auth'); }
    if (!r.ok) throw new Error('http ' + r.status);
    var t = await r.text();
    return t ? JSON.parse(t) : null;
  }

  function showLogin(msg) {
    app.innerHTML = '<h1>Panel de las chicas</h1><form class="card" id="lf" autocomplete="on"><p class="muted">Solo para nosotras. Sanae no debe ver esta página.</p>' + (msg ? '<p class="warn" role="alert">' + esc(msg) + '</p>' : '') + '<label>Correo<input type="email" id="em" autocomplete="username" required></label><label>Contraseña<input type="password" id="pw" autocomplete="current-password" required></label><button class="pri" type="submit">Entrar</button></form>';
    document.getElementById('lf').addEventListener('submit', async function (e) {
      e.preventDefault();
      try {
        var r = await fetch(C.url + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { 'apikey': C.anonKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value }) });
        var j = await r.json();
        if (!r.ok || !j.access_token) { showLogin('Correo o contraseña incorrectos.'); return; }
        token = j.access_token; try { sessionStorage.setItem(TK, token); } catch (e2) {}
        load();
      } catch (err) { showLogin('No se pudo conectar. Comprueba internet.'); }
    });
  }

  async function load() {
    try {
      days = await api('GET', '/rest/v1/days?select=*&order=pos');
      words = await api('GET', '/rest/v1/words?select=*&order=day,pos');
      render();
    } catch (e) { if (e.message !== 'auth') { app.innerHTML = '<p class="warn">No se pudieron cargar los datos. ' + esc(e.message) + '</p>'; } }
  }

  function isOpen(d) { return d.force_open || !d.opens_at || new Date() >= new Date(d.opens_at); }
  function wstatus(d, w, list) {
    if (w.solved) return 'solved';
    if (w.fails >= 3) return 'blown';
    if (d.seq) { var prev = list.filter(function (x) { return x.pos < w.pos; }); return prev.every(function (x) { return x.solved || x.fails >= 3; }) ? 'active' : 'locked'; }
    return w.unlocked ? 'active' : 'locked';
  }
  var ST = { solved: 'Acertada', blown: 'Bloqueada (3 fallos)', active: 'Le toca ahora', locked: 'Bloqueada' };
  function localDT(iso) { if (!iso) return ''; var d = new Date(iso), p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }

  function render() {
    var h = '<div class="top"><h1>Panel de las chicas</h1><button id="out">Salir</button></div><p class="warn">Todo lo que cambies aquí se ve en el móvil de Sanae en unos segundos.</p>';
    days.forEach(function (d) {
      var ws = words.filter(function (w) { return w.day === d.id; });
      var open = isOpen(d);
      h += '<section class="card" data-day="' + esc(d.id) + '"><div class="row"><h2>' + esc(d.title) + ' · ' + esc(d.kicker) + '</h2><span class="tag ' + (open ? 't-open' : 't-closed') + '">' + (open ? 'Abierto' : 'Cerrado') + '</span></div>';
      h += '<div class="row"><button data-act="force" class="' + (d.force_open ? 'on' : '') + '">' + (d.force_open ? 'Abierto a la fuerza (quitar)' : 'Abrir ya') + '</button><button data-act="resetday" class="red">Reiniciar este día</button></div>';
      h += '<label>Se abre solo a partir de (hora de Múnich; vacío = siempre abierto)<input type="datetime-local" data-f="opens_at" value="' + esc(localDT(d.opens_at)) + '"></label>';
      h += '<label>Texto de arriba<textarea data-f="intro">' + esc(d.intro) + '</textarea></label><div class="row"><button data-act="saveday" class="pri">Guardar fecha y texto</button></div>';
      ws.forEach(function (w) {
        var s = wstatus(d, w, ws);
        h += '<div class="card sub" data-w="' + esc(w.id) + '"><div class="row"><h3>' + (w.pos) + '. ' + esc(w.label) + '</h3><span class="tag t-' + s + '">' + ST[s] + '</span><span class="muted">Fallos: ' + w.fails + '/3</span></div><div class="row">';
        if (!d.seq) h += '<button data-act="unlock" class="' + (w.unlocked ? 'on' : '') + '">' + (w.unlocked ? 'Desbloqueada (volver a bloquear)' : 'Desbloquear') + '</button>';
        h += '<button data-act="solve"' + (w.solved ? ' disabled' : '') + '>Darla por acertada</button><button data-act="resetw">Reiniciar (3 bolas)</button></div>';
        h += '<details><summary>Editar acertijo, respuestas y pista</summary><label>Palabra (cómo se enseña)<input type="text" data-f="label" value="' + esc(w.label) + '"></label><label>Acertijo<textarea data-f="riddle">' + esc(w.riddle) + '</textarea></label><label>Respuestas válidas (separadas por | )<input type="text" data-f="accept" value="' + esc(w.accept) + '"></label><label>Pista que desbloquea<input type="text" data-f="clue" value="' + esc(w.clue) + '"></label><div class="row"><button data-act="savew" class="pri">Guardar</button></div></details></div>';
      });
      h += '<div class="card sub"><h3>Planning que desbloquea este día</h3><label>Título<input type="text" data-p="plan_title" value="' + esc(d.plan_title) + '"></label><label>Una línea por parada con formato «hora | texto». Sin hora, deja la barra: « | texto»<textarea data-p="plan_body" style="min-height:190px">' + esc(d.plan_body) + '</textarea></label><div class="row"><button data-act="saveplan" class="pri">Guardar planning</button><button data-act="planforce" class="' + (d.plan_force ? 'on' : '') + '">' + (d.plan_force ? 'Enseñado a la fuerza (quitar)' : 'Enseñárselo ya aunque no haya acertado') + '</button></div><p class="muted">Se lo enseña la web cuando acierta las tres palabras del día, o si lo fuerzas aquí.</p></div></section>';
    });
    h += '<section class="card"><h2>Reiniciar todo</h2><p class="muted">Pone a cero los intentos, las palabras acertadas y los desbloqueos de todos los días (para la prueba general). No toca los textos.</p><button class="red" data-act="resetall">Reiniciar todo el progreso</button></section>';
    app.innerHTML = h;
  }

  function val(root, sel) { var el = root.querySelector(sel); return el ? el.value : ''; }
  async function act(btn) {
    var a = btn.getAttribute('data-act'), dayEl = btn.closest('[data-day]'), wEl = btn.closest('[data-w]');
    var did = dayEl && dayEl.getAttribute('data-day'), wid = wEl && wEl.getAttribute('data-w');
    var d = days.filter(function (x) { return x.id === did; })[0], w = words.filter(function (x) { return x.id === wid; })[0];
    var P = 'Prefer', RET = { 'Prefer': 'return=minimal' };
    var Z = { fails: 0, solved: false };
    if (a === 'force') await api('PATCH', '/rest/v1/days?id=eq.' + did, { force_open: !d.force_open }, RET);
    else if (a === 'planforce') await api('PATCH', '/rest/v1/days?id=eq.' + did, { plan_force: !d.plan_force }, RET);
    else if (a === 'saveday') {
      var v = val(dayEl, '[data-f="opens_at"]');
      await api('PATCH', '/rest/v1/days?id=eq.' + did, { opens_at: v ? new Date(v).toISOString() : null, intro: val(dayEl, '[data-f="intro"]') }, RET);
    } else if (a === 'saveplan') await api('PATCH', '/rest/v1/days?id=eq.' + did, { plan_title: val(dayEl, '[data-p="plan_title"]'), plan_body: val(dayEl, '[data-p="plan_body"]') }, RET);
    else if (a === 'unlock') await api('PATCH', '/rest/v1/words?id=eq.' + wid, { unlocked: !w.unlocked }, RET);
    else if (a === 'solve') { if (!confirm('¿Dar por acertada «' + w.label + '»? Sanae verá su pista ya.')) return; await api('PATCH', '/rest/v1/words?id=eq.' + wid, { solved: true }, RET); }
    else if (a === 'resetw') await api('PATCH', '/rest/v1/words?id=eq.' + wid, Z, RET);
    else if (a === 'savew') await api('PATCH', '/rest/v1/words?id=eq.' + wid, { label: val(wEl, '[data-f="label"]'), riddle: val(wEl, '[data-f="riddle"]'), accept: val(wEl, '[data-f="accept"]'), clue: val(wEl, '[data-f="clue"]') }, RET);
    else if (a === 'resetday') { if (!confirm('¿Reiniciar todo ' + d.title + '? Vuelve a empezar desde cero.')) return; await api('PATCH', '/rest/v1/words?day=eq.' + did, { fails: 0, solved: false, unlocked: false }, RET); }
    else if (a === 'resetall') { if (!confirm('¿Reiniciar el progreso de TODOS los días?')) return; await api('PATCH', '/rest/v1/words?id=neq.__none__', { fails: 0, solved: false, unlocked: false }, RET); }
    toast('Guardado');
    await load();
  }

  app.addEventListener('click', async function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'out') { token = null; try { sessionStorage.removeItem(TK); } catch (e2) {} showLogin(); return; }
    if (!b.getAttribute('data-act') || busy) return;
    busy = true;
    try { await act(b); } catch (err) { if (err.message !== 'auth') toast('No se pudo guardar. Prueba otra vez.', true); }
    busy = false;
  });

  if (!C.url || !C.anonKey) { app.innerHTML = '<p class="warn">Falta conectar la base de datos (config.js).</p>'; return; }
  try { token = sessionStorage.getItem(TK); } catch (e) {}
  if (token) load(); else showLogin();
})();
</script>
</body>
</html>
